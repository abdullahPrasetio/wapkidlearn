# docker-compose.yml — Development
# Hanya postgres untuk dev lokal. Backend & frontend dijalankan via `make dev`.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-wapkidlearn}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
      POSTGRES_DB: ${DB_NAME:-wapkidlearn_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wapkidlearn}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
