<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 600, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Floating Animation */
        @keyframes float-up-fade {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-40px) scale(1.2); }
        }
        .animate-float-up-fade {
            animation: float-up-fade 1s ease-out forwards;
        }

        /* Plump Button effect */
        .btn-plump {
            border-bottom-width: 4px;
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-plump:active {
            border-bottom-width: 0px;
            transform: translateY(4px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface text-on-surface h-screen overflow-hidden flex flex-col font-body-child selection:bg-primary-fixed">
<div class="flex-1 flex flex-col max-w-md w-full mx-auto relative bg-surface-container-lowest shadow-lg shadow-[rgba(17,24,39,0.05)] h-full overflow-hidden">
<!-- Top Game Header (Replacing Standard Nav for focused mode) -->
<header class="px-lg py-md flex flex-col gap-sm shrink-0 relative z-10 bg-surface-container-lowest">
<div class="flex justify-between items-center w-full">
<button aria-label="Close Game" class="w-[44px] h-[44px] flex items-center justify-center rounded-full bg-surface-variant text-on-surface-variant active:scale-95 transition-transform">
<span class="material-symbols-outlined">close</span>
</button>
<div class="font-h2-child text-h2-child text-primary font-bold">
                    Question 4 / 10
                </div>
<button aria-label="Pause" class="w-[44px] h-[44px] flex items-center justify-center rounded-full bg-surface-variant text-on-surface-variant active:scale-95 transition-transform">
<span class="material-symbols-outlined">pause</span>
</button>
</div>
<!-- Double Progress / Timer Bars -->
<div class="flex flex-col gap-xs mt-sm">
<!-- Level Progress -->
<div class="w-full h-3 bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-primary-container rounded-full transition-all duration-500 ease-out" style="width: 40%;"></div>
</div>
<!-- Time remaining -->
<div class="w-full h-1.5 bg-surface-container-highest rounded-full overflow-hidden mt-1 opacity-60">
<div class="h-full bg-error rounded-full transition-all duration-1000 linear" style="width: 75%;"></div>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col px-lg pb-xl relative z-0">
<!-- Context Badges -->
<div class="flex justify-center gap-md py-md mt-sm">
<div class="bg-secondary-fixed text-on-secondary-fixed-variant px-md py-1 rounded-full font-body-child text-sm font-bold flex items-center gap-1 border-2 border-surface-container-highest">
<span class="material-symbols-outlined text-[18px]">calculate</span>
                    Addition
                </div>
<div class="bg-tertiary-fixed text-on-tertiary-fixed-variant px-md py-1 rounded-full font-body-child text-sm font-bold flex items-center gap-1 border-2 border-surface-container-highest shadow-sm">
<span class="text-lg">🔥</span> x5
                </div>
</div>
<!-- The Question Area -->
<div class="flex-1 flex items-center justify-center flex-col relative my-lg">
<div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-primary-fixed/40 to-transparent rounded-full blur-2xl -z-10 scale-150"></div>
<h1 class="font-display-child text-display-child text-on-surface text-center tracking-tight drop-shadow-sm">
                    12 + 8 = ?
                </h1>
</div>
<!-- Answer Grid (2x2) -->
<div class="grid grid-cols-2 gap-lg shrink-0 mt-auto relative z-10">
<button class="btn-plump bg-surface-container-lowest border-2 border-surface-container-highest border-b-surface-variant rounded-xl flex items-center justify-center min-h-[120px] shadow-sm relative overflow-hidden group hover:bg-surface-container-low transition-colors" onclick="triggerReward(this)">
<span class="font-display-child text-h1-child text-on-surface font-extrabold group-hover:scale-110 transition-transform">18</span>
</button>
<button class="btn-plump bg-surface-container-lowest border-2 border-surface-container-highest border-b-surface-variant rounded-xl flex items-center justify-center min-h-[120px] shadow-sm relative overflow-hidden group hover:bg-surface-container-low transition-colors" onclick="triggerReward(this)">
<span class="font-display-child text-h1-child text-on-surface font-extrabold group-hover:scale-110 transition-transform">20</span>
</button>
<button class="btn-plump bg-surface-container-lowest border-2 border-surface-container-highest border-b-surface-variant rounded-xl flex items-center justify-center min-h-[120px] shadow-sm relative overflow-hidden group hover:bg-surface-container-low transition-colors" onclick="triggerReward(this)">
<span class="font-display-child text-h1-child text-on-surface font-extrabold group-hover:scale-110 transition-transform">22</span>
</button>
<button class="btn-plump bg-surface-container-lowest border-2 border-surface-container-highest border-b-surface-variant rounded-xl flex items-center justify-center min-h-[120px] shadow-sm relative overflow-hidden group hover:bg-surface-container-low transition-colors" onclick="triggerReward(this)">
<span class="font-display-child text-h1-child text-on-surface font-extrabold group-hover:scale-110 transition-transform">10</span>
</button>
</div>
<!-- Decorative Mascot Peeking -->
<div class="absolute bottom-4 right-4 w-32 h-32 opacity-50 pointer-events-none z-0">
<img alt="WapKidLearn Logo" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCOsmSb9xtMVu0Krnd6ACdlzLmnTT475erk4u5XLFuELqtmtkbFRovd-yMZA5mzi2JJPZpPLPrWtgVglJ8Pl_3TeX8W2Ymd1VKiHAjUMSRTy__ntSiC1HIG1IH_EUDw5w5Rcwldp7vc2lnqVUvYMiN9Hsz59VJfMyJJr-U2y_FZKL-6rXomj85uoF6CAOYwi_UXa1GIpTL34m2V52eDLVjt2Tu4ky0OxqiCY-r9s1IR3tny9bW74QAmRXLzTPP45vW79kY0z0w5mLKP"/>
</div>
</main>
<!-- Floating Reward Element Container -->
<div class="absolute inset-0 pointer-events-none flex items-center justify-center z-50" id="reward-container"></div>
</div>
<script>
        function triggerReward(btn) {
            // Get button's position
            const rect = btn.getBoundingClientRect();
            
            const container = document.getElementById('reward-container');
            
            const rewardEl = document.createElement('div');
            rewardEl.className = 'absolute font-display-child text-h1-child text-primary-container font-extrabold drop-shadow-md animate-float-up-fade flex items-center gap-xs';
            
            // Position above the clicked button
            rewardEl.style.top = (rect.top - 40) + 'px';
            rewardEl.style.left = (rect.left + rect.width / 2 - 40) + 'px';
            
            rewardEl.innerHTML = '+15 <span class="text-[32px]">⭐</span>';
            
            container.appendChild(rewardEl);
            
            // Highlight button temporarily
            const originalBorder = btn.style.borderColor;
            btn.classList.add('border-primary-container', 'bg-primary-fixed');
            
            setTimeout(() => {
                rewardEl.remove();
                btn.classList.remove('border-primary-container', 'bg-primary-fixed');
            }, 1000);
        }
    </script>
</body></html>
