<!-- Simple Script for UI Interaction -->
<script>
        function selectStep(poin, element) {
            // Calculate minutes (10 poin = 1 minute)
            const minutes = poin / 10;
            
            // Update preview text
            document.getElementById('previewPoin').textContent = `${poin} poin`;
            document.getElementById('previewMenit').textContent = `${minutes} menit nonton`;
            
            // Reset all buttons
            const buttons = element.parentElement.querySelectorAll('button');
            buttons.forEach(btn => {
                btn.className = 'relative z-10 w-12 h-12 rounded-full flex items-center justify-center font-body-child text-body-child text-on-surface hover:bg-surface-variant transition-all';
            });
            
            // Highlight selected button
            element.className = 'relative z-10 w-12 h-12 rounded-full flex items-center justify-center font-h2-child text-h2-child bg-[#F97316] text-white shadow-md transform scale-110 transition-all';
            
            // Update track background visual (simplified for this demo)
            const track = document.getElementById('sliderTrack');
            if(poin === 10) track.style.width = '25%';
            if(poin === 20) track.style.width = '50%';
            if(poin === 50) track.style.width = '75%';
            if(poin === 100) track.style.width = '100%';
        }
    </script>
