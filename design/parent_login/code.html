<body class="bg-surface-container-lowest text-on-surface font-body-admin min-h-screen flex flex-col items-center justify-center p-md">
<!-- Container -->
<div class="w-full max-w-[400px] flex flex-col gap-xl">
<!-- Header -->
<div class="flex flex-col items-center gap-sm text-center">
<img alt="WapKidLearn Logo" class="w-48 h-auto object-contain mb-md" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCOsmSb9xtMVu0Krnd6ACdlzLmnTT475erk4u5XLFuELqtmtkbFRovd-yMZA5mzi2JJPZpPLPrWtgVglJ8Pl_3TeX8W2Ymd1VKiHAjUMSRTy__ntSiC1HIG1IH_EUDw5w5Rcwldp7vc2lnqVUvYMiN9Hsz59VJfMyJJr-U2y_FZKL-6rXomj85uoF6CAOYwi_UXa1GIpTL34m2V52eDLVjt2Tu4ky0OxqiCY-r9s1IR3tny9bW74QAmRXLzTPP45vW79kY0z0w5mLKP"/>
<h1 class="font-h1-admin text-h1-admin text-on-surface">Panel Orang Tua</h1>
<p class="font-body-admin text-body-admin text-on-surface-variant">Masuk untuk memantau perkembangan belajar anak Anda.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-md w-full">
<!-- Email Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-admin text-label-admin text-on-surface-variant ml-xs" for="email">Alamat Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span aria-hidden="true" class="material-symbols-outlined text-on-surface-variant" data-icon="mail">mail</span>
</div>
<input class="w-full pl-xl pr-sm py-[10px] bg-surface-container-lowest border-2 border-outline-variant rounded focus:outline-none focus:border-secondary focus:ring-4 focus:ring-secondary/20 transition-all font-body-admin text-body-admin text-on-surface placeholder-on-surface-variant/50" id="email" name="email" placeholder="contoh@email.com" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-admin text-label-admin text-on-surface-variant ml-xs" for="password">Kata Sandi</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span aria-hidden="true" class="material-symbols-outlined text-on-surface-variant" data-icon="lock">lock</span>
</div>
<input class="w-full pl-xl pr-xl py-[10px] bg-surface-container-lowest border-2 border-outline-variant rounded focus:outline-none focus:border-secondary focus:ring-4 focus:ring-secondary/20 transition-all font-body-admin text-body-admin text-on-surface placeholder-on-surface-variant/50" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-sm flex items-center text-on-surface-variant hover:text-on-surface transition-colors" onclick="togglePassword()" type="button">
<span aria-hidden="true" class="material-symbols-outlined" data-icon="visibility_off" id="visibility-icon">visibility_off</span>
</button>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col gap-lg mt-sm">
<button class="w-full bg-primary-container text-on-primary-container font-h2-admin text-h2-admin h-touch_target_min rounded flex items-center justify-center hover:opacity-90 active:scale-[0.98] transition-all shadow-md" type="submit">
                    Masuk
                </button>
<!-- Alternate Link -->
<a class="w-full flex items-center justify-center gap-xs text-primary font-body-admin text-body-admin font-semibold hover:opacity-80 transition-opacity" href="#">
                    Masuk sebagai Anak
                    <span aria-hidden="true" class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</a>
</div>
</form>
</div>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const visibilityIcon = document.getElementById('visibility-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                visibilityIcon.textContent = 'visibility';
                visibilityIcon.setAttribute('data-icon', 'visibility');
            } else {
                passwordInput.type = 'password';
                visibilityIcon.textContent = 'visibility_off';
                visibilityIcon.setAttribute('data-icon', 'visibility_off');
            }
        }
    </script>
</body></html>
