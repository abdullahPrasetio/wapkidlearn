<div class="grid grid-cols-4 sm:grid-cols-6 gap-sm">
<!-- Checkbox Grid -->
<script>
                    const gridContainer = document.currentScript.parentElement;
                    const allowedHours = [8, 9, 10, 15, 16, 17, 18, 19];
                    for(let i=0; i<24; i++) {
                        const hour = i.toString().padStart(2, '0') + ':00';
                        const isChecked = allowedHours.includes(i) ? 'checked' : '';
                        const bgColor = allowedHours.includes(i) ? 'bg-primary-container text-white border-primary-container' : 'bg-surface-container-lowest text-on-surface-variant border-outline-variant hover:bg-surface-variant';
                        
                        gridContainer.innerHTML += `
                            <label class="relative flex items-center justify-center p-sm border rounded-lg cursor-pointer transition-colors ${bgColor} group">
                                <input type="checkbox" class="sr-only" ${isChecked}>
                                <span class="font-label-admin text-label-admin select-none">${hour}</span>
                            </label>
                        `;
                    }
                </script>
</div>
</section>

<!-- Sticky Save Button -->

<button class="px-xl py-sm h-[44px] bg-[#F97316] text-[#FFFFFF] rounded-lg font-semibold hover:opacity-90 transition-opacity shadow-sm">
                Simpan Pengaturan
            </button>
</div>
</div>
<script>
        // Simple toggle logic for the hour grid visual updates
        document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
            if(!checkbox.closest('.peer')) { // exclude emergency lock
                checkbox.addEventListener('change', function() {
                    const label = this.closest('label');
                    if(this.checked) {
                        label.classList.remove('bg-surface-container-lowest', 'text-on-surface-variant', 'border-outline-variant', 'hover:bg-surface-variant');
                        label.classList.add('bg-primary-container', 'text-white', 'border-primary-container');
                    } else {
                        label.classList.add('bg-surface-container-lowest', 'text-on-surface-variant', 'border-outline-variant', 'hover:bg-surface-variant');
                        label.classList.remove('bg-primary-container', 'text-white', 'border-primary-container');
                    }
                });
            }
        });
    </script>
