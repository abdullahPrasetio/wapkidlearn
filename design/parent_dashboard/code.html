<div class="flex justify-between items-start mb-sm">
<h2 class="font-h2-admin text-on-surface">Budi</h2>
<span class="inline-flex items-center gap-xs px-2 py-1 rounded-full bg-surface-container text-secondary font-label-admin">
<span class="material-symbols-outlined text-[14px]">check_circle</span>
                            Aktif
                        </span>
</div>
<div class="flex flex-wrap gap-sm mb-sm">
<!-- Poin Badge -->

<span class="material-symbols-outlined text-[16px]">stars</span>
                            1,250 Poin
                        </div>
<!-- Watch Time -->
<div class="inline-flex items-center gap-xs bg-surface-container-low text-on-surface-variant px-2 py-1 rounded-lg font-label-admin">
<span class="material-symbols-outlined text-[16px]">schedule</span>
                            15m hari ini
                        </div>
</div>
<button class="text-secondary font-label-admin hover:underline mt-xs flex items-center gap-xs">
                        Lihat Progres Detail <span class="material-symbols-outlined text-[14px]">arrow_forward</span>
</button>
</div>
</article>
<!-- Child Card 2: Siti (Locked) -->

<div class="absolute inset-0 bg-surface-variant/10 z-0"></div>

                        Buka Akses <span class="material-symbols-outlined text-[18px]">workspace_premium</span>
</button>
</div>
</article>
<!-- Add Child Card -->
<button class="w-full border-2 border-dashed border-outline-variant rounded-xl p-lg flex flex-col items-center justify-center gap-sm text-on-surface-variant hover:bg-surface-container-low hover:border-secondary transition-all group min-h-[120px]">
